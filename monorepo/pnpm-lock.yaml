lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: 5.9.2
        version: 5.9.2

  apps/admin:
    dependencies:
      '@monorepo/proto':
        specifier: workspace:*
        version: link:../../proto/gen/ts
      '@monorepo/ui':
        specifier: workspace:*
        version: link:../../libs/ui

  apps/web:
    dependencies:
      '@monorepo/core':
        specifier: workspace:*
        version: link:../../libs/core
      '@monorepo/proto':
        specifier: workspace:*
        version: link:../../proto/gen/ts
      '@monorepo/ui':
        specifier: workspace:*
        version: link:../../libs/ui

  libs/core:
    dependencies:
      '@monorepo/proto':
        specifier: workspace:*
        version: link:../../proto/gen/ts

  libs/ui:
    dependencies:
      '@monorepo/core':
        specifier: workspace:*
        version: link:../core
      '@monorepo/proto':
        specifier: workspace:*
        version: link:../../proto/gen/ts

  proto/gen/ts: {}

packages:

  typescript@5.9.2:
    resolution: {integrity: sha512-CWBzXQrc/qOkhidw1OzBTQuYRbfyxDXJMVJ1XNwUHGROVmuaeiEm3OslpZ1RV96d7SKKjZKrSJu3+t/xlw3R9A==}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  typescript@5.9.2: {}
