# Standalone workspace, so running dagger here cannot modify a parent repo's
# dagger.toml (which `dagger sdk install` will otherwise do).
[modules.dagger-dang-sdk]
source = "github.com/dagger/dang-sdk"

[modules.mangle]
source = "mangle"

[modules.dagger-dang-sdk.as-sdk]
name = "dang"

[[modules.dagger-dang-sdk.as-sdk.modules]]
path = "mangle"
