services:
  neo4j:
    image: neo4j:2026.04
    container_name: jfrog2026-neo4j
    ports:
      - "7474:7474"   # HTTP / Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/monograph2026
      # Local dev instance. Not exposed beyond localhost; credentials are
      # deliberately boring and are not reused anywhere else.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p monograph2026 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  neo4j-data:
  neo4j-logs:
